plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.0'
group = 'com.hoyi.alexbornbans'
base { archivesName = 'alex_born_bans' }

tasks.withType(Jar).configureEach {
    archiveBaseName = 'alex_born_bans-neoforge1.21.1'
    archiveVersion = project.version
    exclude '**/*.java'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.255'
    runs {
        server {
            server()
            programArguments.addAll '--nogui'
        }
    }
    mods {
        alex_born_bans {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    def props = [mod_id: 'alex_born_bans', mod_name: 'Alex & Born Bans', mod_version: project.version,
                 minecraft_version: '1.21.1', neoforge_version: '21.1.255']
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}
