plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = '1.0.0'
group = 'com.hoyi.alexbornbans'
base { archivesName = 'alex_born_bans' }

tasks.withType(Jar).configureEach {
    archiveBaseName = 'alex_born_bans-forge1.20.1'
    archiveVersion = project.version
    exclude '**/*.java'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        server {
            workingDirectory project.file('run')
            args '--nogui'
        }
    }
}

mixin {
    add sourceSets.main, 'alex_born_bans.refmap.json'
    config 'alex_born_bans.mixins.json'
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.22'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.debug = false
    options.debugOptions.debugLevel = ''
}

processResources {
    def props = [mod_id: 'alex_born_bans', mod_name: 'Alex & Born Bans', mod_version: project.version,
                 minecraft_version: '1.20.1', forge_version: '47.3.22']
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('META-INF/mods.toml') { expand props }
}

jar.finalizedBy('reobfJar')
